<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nuestras canciones · Microbio y Galindo</title><script>try{if(!localStorage.getItem("mg_auth"))location.replace("splash.html")}catch(e){}</script><style>body{margin:0;background:#141414;color:#fff;font:16px/1.5 Arial,sans-serif}main{max-width:850px;margin:auto;padding:28px 20px 80px}a{color:#fff}.back{text-decoration:none}h1{font-size:clamp(2rem,7vw,4rem);line-height:1.05}p,small{color:#bbb}.song{background:#242424;border:1px solid #404040;border-radius:12px;padding:16px;margin:12px 0}.song b,.song small{display:block}.song audio{width:100%;margin-top:12px}</style></head><body><main><a class="back" href="index.html">← Volver a la historia</a><h1>La música de nuestra historia</h1><p id="description"></p><div id="songs"></div></main><script src="config.js"></script><script src="cliente.js?v=mg-1"></script><script>const tracks=window.TDN.media.canciones;document.querySelector('#description').textContent=`${tracks.length} canciones acompañan estas películas y series. Fragmentos que arrancan en momentos de mayor intensidad de cada canción.`;document.querySelector('#songs').innerHTML=tracks.map((name,i)=>`<div class="song"><b>${String(i+1).padStart(2,'0')}. ${name}</b><small>Fragmento musical</small><audio controls preload="none" src="${window.TDN.media.temporadas[i]}"></audio></div>`).join('');document.querySelectorAll('audio').forEach(a=>a.addEventListener('play',()=>document.querySelectorAll('audio').forEach(b=>{if(a!==b)b.pause()})));</script></body></html>
