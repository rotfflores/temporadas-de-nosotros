<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>La música de Maribel y Silvino</title><style>body{margin:0;background:#141414;color:#fff;font:16px/1.5 Arial,sans-serif}main{max-width:850px;margin:auto;padding:28px 22px 80px}a{color:#fff}h1{font-size:clamp(2rem,7vw,3.8rem);line-height:1.1}p{color:#bbb}.song{background:#242424;border:1px solid #444;padding:16px 20px;border-radius:12px;margin:12px 0}.song b{display:block;margin-bottom:8px}audio{width:100%}</style></head><body><main><a href="index.html">← Volver al inicio</a><h1>Nuestra banda sonora</h1><p>Los momentos más intensos de las diez canciones que acompañan las películas y series.</p><div id="songs"></div></main><script>const names=['A la antigüita — Calibre 50','Amor sincero — Grupo Bryndis','Aquí hay para llevar — La Arrolladora Banda El Limón','A mí me gustas tú — Los Rojos, Duelo y Oscar Iván Treviño','Loco por ti — Los Temerarios','Las locuras mías — Omar Chaparro','Mi promesa — Pesado','La alegría de mi vida — Río Roma','Mi persona favorita — Río Roma','Tu poeta — Alex Campos'];document.getElementById('songs').innerHTML=names.map((n,i)=>`<div class="song"><b>${i+1}. ${n}</b><audio controls preload="none" src="assets/cliente/audio/climax-${String(i+1).padStart(2,'0')}.mp3"></audio></div>`).join('');</script></body></html>
