<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Álbum de Maribel y Silvino</title><style>body{margin:0;background:#141414;color:#fff;font:16px/1.5 Arial,sans-serif}main{max-width:1200px;margin:auto;padding:28px 22px 80px}a{color:#fff}h1{font-size:clamp(2rem,7vw,3.8rem)}p{color:#bbb}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.grid img{width:100%;height:230px;object-fit:cover;border-radius:6px}.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.videos video{width:100%;max-height:400px;background:#000}</style></head><body><main><a href="index.html">← Volver al inicio</a><h1>Nuestro álbum</h1><p>Sesenta y dos fotos y tres videos de nuestra historia.</p><div class="grid" id="photos"></div><h2>Videos</h2><div class="videos" id="videos"></div></main><script>const p=n=>`assets/cliente/fotos/foto-${String(n).padStart(2,'0')}.jpeg`;document.getElementById('photos').innerHTML=Array.from({length:62},(_,i)=>`<a href="${p(i+1)}" target="_blank"><img src="${p(i+1)}" loading="lazy" alt="Recuerdo ${i+1} de Maribel y Silvino"></a>`).join('');document.getElementById('videos').innerHTML=[1,2,3].map(i=>`<video src="assets/cliente/video/video-${String(i).padStart(2,'0')}.mp4" controls preload="none" playsinline></video>`).join('');</script></body></html>
