<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nuestros recuerdos · Rosa Janet y Greys</title><style>body{margin:0;background:#141414;color:#fff;font:16px/1.5 Arial,sans-serif}main{max-width:1150px;margin:auto;padding:28px 20px 90px}a{color:#fff}.back{text-decoration:none}h1{font-size:clamp(2rem,7vw,4rem);line-height:1.05}p{color:#bbb}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.grid img,.grid video{width:100%;height:230px;object-fit:cover;border-radius:8px;background:#222}.grid img{object-fit:contain;object-position:center center}.grid video{height:auto;aspect-ratio:9/12;object-position:center center}h2{margin-top:48px}</style></head><body><main><a class="back" href="index.html">← Volver a la historia</a><h1>Nuestros recuerdos</h1><p>Las fotos y videos que Rosa Janet eligió para contar su historia con Greys y su familia.</p><h2>Fotos</h2><div class="grid" id="photos"></div><h2>Videos</h2><div class="grid" id="videos"></div><p><a href="canciones.html">Escuchar nuestras canciones →</a></p></main><script src="media-manifest.js"></script><script>document.querySelector('#photos').innerHTML=CLIENT_MEDIA.fotos.map((x,i)=>`<a href="${x.ruta}" target="_blank" rel="noopener"><img loading="lazy" src="${x.ruta}" alt="Recuerdo ${i+1} de Rosa Janet y Greys"></a>`).join('');document.querySelector('#videos').innerHTML=CLIENT_MEDIA.videos.map((x,i)=>`<video controls playsinline preload="none" poster="${x.poster}" src="${x.ruta}" aria-label="Video ${i+1} de Rosa Janet y Greys"></video>`).join('');</script></body></html>
