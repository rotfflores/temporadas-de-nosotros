<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nuestro álbum · Salvador y Jazmín</title><style>body{margin:0;background:#141414;color:#fff;font:16px/1.5 Arial,sans-serif}main{max-width:1150px;margin:auto;padding:28px 20px 90px}a{color:#fff}.back{text-decoration:none}h1{font-size:clamp(2rem,7vw,4rem);line-height:1.05}p{color:#bbb}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.grid img{width:100%;height:230px;object-fit:cover;border-radius:8px;background:#222}.grid a:last-child img{object-fit:contain}</style></head><body><main><a class="back" href="index.html">← Volver a la historia</a><h1>Nuestro álbum</h1><p>Las 16 imágenes que Salvador compartió para contar esta historia, incluida una captura de pantalla.</p><div class="grid" id="album"></div><p><a href="canciones.html">Escuchar nuestras canciones →</a></p></main><script>document.getElementById('album').innerHTML=Array.from({length:16},(_,i)=>{const src=`assets/fotos/foto-${String(i+1).padStart(2,'0')}.webp`;const alt=i===15?'Captura de pantalla compartida por Salvador':`Recuerdo ${i+1} de Salvador y Jazmín`;return `<a href="${src}" target="_blank"><img loading="lazy" src="${src}" alt="${alt}"></a>`}).join('');</script></body></html>
