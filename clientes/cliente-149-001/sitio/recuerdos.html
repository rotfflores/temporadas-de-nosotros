<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Álbum de recuerdos · Juan Alberto y Dulce</title><style>body{margin:0;background:#141414;color:white;font:16px/1.5 Arial,sans-serif}main{max-width:1200px;margin:auto;padding:30px 20px 90px}a{color:white}h1{font-size:clamp(2.3rem,6vw,4rem);margin:24px 0 0}p{color:#bbb}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}.grid img,.grid video{width:100%;height:210px;object-fit:cover;background:#222;border-radius:7px}.grid video{height:auto;aspect-ratio:4/3}h2{margin-top:50px}figure{margin:0}figcaption{font-size:12px;color:#aaa;padding:4px}a.back{text-decoration:none}</style></head><body><main><a class="back" href="index.html">← Volver a la historia</a><h1>Nuestro álbum</h1><p>Las cinco tandas de recuerdos que compartiste. La quinta contiene la música y los mensajes de voz.</p><div id="album"></div><p><a href="canciones.html">Escuchar los audios y las canciones →</a></p></main><script src="media-manifest.js"></script><script>const labels={1:'La primera vez · 17 de abril',2:'La Marquesita · 18 de abril',3:'Pachuca, Huasca y Prismas Basálticos',4:'Seis meses juntos'};const box=document.getElementById('album');for(let n=1;n<=4;n++){const photos=CLIENT_MEDIA.fotos.filter(x=>x.tanda===n),videos=CLIENT_MEDIA.videos.filter(x=>x.tanda===n);const section=document.createElement('section');section.innerHTML=`<h2>${labels[n]}</h2><div class="grid">${photos.map((x,i)=>`<a href="${x.ruta}" target="_blank"><img loading="lazy" src="${x.ruta}" alt="Recuerdo ${i+1} de la tanda ${n}"></a>`).join('')}</div>${videos.length?'<h3>Videos</h3><div class="grid">'+videos.map((x,i)=>`<figure><video controls preload="none" src="${x.ruta}"></video><figcaption>Video ${i+1}</figcaption></figure>`).join('')+'</div>':''}`;box.append(section)}</script></body></html>
