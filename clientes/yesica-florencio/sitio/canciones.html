<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nuestras canciones · Yesica y Florencio</title><style>body{margin:0;background:#141414;color:#fff;font:16px/1.5 Arial,sans-serif}main{max-width:850px;margin:auto;padding:28px 20px 80px}a{color:#fff}.back{text-decoration:none}h1{font-size:clamp(2rem,7vw,4rem);line-height:1.05}p,small{color:#bbb}.song{background:#242424;border:1px solid #404040;border-radius:12px;padding:16px;margin:12px 0}.song b,.song small{display:block}.song audio{width:100%;margin-top:12px}</style></head><body><main><a class="back" href="index.html">← Volver a la historia</a><h1>La música de nuestra historia</h1><p>Ocho canciones elegidas para acompañar nuestras películas. Cada una comienza en un fragmento destacado.</p><div id="songs"></div></main><script>const names=['Entra en mi vida — Sin Bandera','Te amo — Franco De Vita','A besitos — Los Diablitos','Amorcito mío — Joan Sebastian','Te quiero, te amo — Pesado','Razón — Los Caligaris','Gracias por tu amor — Pesado','Mi nueva vida — Jhon Alex El Guajiro'];document.getElementById('songs').innerHTML=names.map((name,i)=>`<div class="song"><b>${String(i+1).padStart(2,'0')}. ${name}</b><small>Fragmento de la película ${i+1}</small><audio controls preload="none" src="assets/audio/cancion-${String(i+1).padStart(2,'0')}.mp3"></audio></div>`).join('');</script></body></html>
