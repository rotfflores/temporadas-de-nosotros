<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boleto de estreno | Temporadas de Nosotros</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Boleto imprimible con QR. Tamaño pensado para media carta / A5 horizontal. */
    body { animation: none; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; padding: 2rem 16px; }
    .ticket {
      width: min(760px, 100%); display: grid; grid-template-columns: 1fr; background: #0b0b0b; color: #fff;
      border-radius: 12px; overflow: hidden; border: 1px solid #262626; box-shadow: 0 20px 50px rgba(0,0,0,.6);
    }
    @media (min-width: 640px) { .ticket { grid-template-columns: 1fr 250px; } }
    .t-main { padding: 2rem; position: relative;
      background: radial-gradient(120% 120% at 0% 0%, rgba(229,9,20,.35), transparent 55%), #0b0b0b; }
    .t-main .logo { font-size: 2.4rem; }
    .t-kicker { letter-spacing: .35em; font-size: .72rem; color: var(--netflix-gray); margin: 1.2rem 0 .3rem; }
    .t-main h1 { font-family: var(--font-display); font-weight: 400; font-size: 2.6rem; line-height: 1; margin: 0 0 .6rem; }
    .t-main p { color: var(--netflix-light); margin: .3rem 0; }
    .t-meta { display: flex; gap: 1.4rem; flex-wrap: wrap; margin-top: 1.4rem; }
    .t-meta small { display: block; color: var(--netflix-gray); letter-spacing: .2em; font-size: .65rem; }
    .t-meta b { font-size: 1.05rem; }
    .t-side { background: #f5f5f1; color: #141414; padding: 1.6rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8rem; text-align: center;
      border-left: 2px dashed #bbb; }
    #qr { background: #fff; padding: 8px; border-radius: 6px; }
    #qr img, #qr canvas { width: 180px !important; height: 180px !important; }
    .t-side small { font-size: .78rem; color: #555; }
    .no-print { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
    .url { color: var(--netflix-gray); font-size: .8rem; word-break: break-all; text-align: center; max-width: 760px; }
    @media print {
      body { background: #fff; padding: 0; }
      .no-print, .url { display: none !important; }
      .ticket { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; grid-template-columns: 1fr 250px; }
    }
  </style>
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="ticket">
    <div class="t-main">
      <div class="logo" id="logo">TEMPORADAS DE NOSOTROS</div>
      <div class="t-kicker">ESTRENO EXCLUSIVO · 1 ENTRADA</div>
      <h1 id="who"></h1>
      <p id="sub"></p>
      <div class="t-meta">
        <div><small>ESTRENO</small><b id="date"></b></div>
        <div><small>TEMPORADAS</small><b id="seasons"></b></div>
        <div><small>CLASIFICACIÓN</small><b id="age"></b></div>
        <div id="pwWrap"><small>CONTRASEÑA</small><b id="pw"></b></div>
      </div>
    </div>
    <div class="t-side">
      <div id="qr"></div>
      <b>Escanea para ver</b>
      <small>Mejor con audífonos y pañuelos a la mano.</small>
    </div>
  </div>
  <p class="url" id="url"></p>
  <div class="no-print">
    <label style="display:flex;align-items:center;gap:.4rem;color:var(--netflix-gray)"><input type="checkbox" id="showPw"> Imprimir contraseña</label>
    <button class="btn btn-gray" id="png">Descargar QR (PNG)</button>
    <button class="btn btn-red" onclick="print()">Imprimir</button>
  </div>
  <script>
    (function () {
      const C = window.TDN, P = C.pareja;
      // URL a codificar: la de config.sitio.url o, si falta, la carpeta actual
      const url = C.sitio.url || location.href.replace(/imprimible\.html.*$/, "index.html");
      document.getElementById("url").textContent = "Enlace del QR: " + url + (C.sitio.url ? "" : "  ← [PENDIENTE] define sitio.url en config.js");
      document.getElementById("who").textContent = "Para " + P.nombreB;
      document.getElementById("sub").textContent = "Una serie original de " + P.nombreA + ". " + P.anios + (P.anios === 1 ? " año" : " años") + " de historia, en " + C.temporadas.length + " temporadas.";
      document.getElementById("date").textContent = C.acceso.estreno ? new Date(C.acceso.estreno).toLocaleString("es", { dateStyle: "medium", timeStyle: "short" }) : "Ya disponible";
      document.getElementById("seasons").textContent = C.temporadas.length + " + Final";
      document.getElementById("age").textContent = C.sitio.clasificacion + " Romance";
      const pwWrap = document.getElementById("pwWrap"), cb = document.getElementById("showPw");
      document.getElementById("pw").textContent = C.acceso.password || "—";
      const syncPw = () => (pwWrap.style.display = cb.checked && C.acceso.password ? "" : "none");
      cb.onchange = syncPw; syncPw();
      if (window.QRCode) new QRCode(document.getElementById("qr"), { text: url, width: 360, height: 360, colorDark: "#141414", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
      else document.getElementById("qr").textContent = "No se pudo cargar el generador de QR (sin conexión).";
      document.getElementById("png").onclick = () => {
        const c = document.querySelector("#qr canvas"); if (!c) return;
        const a = document.createElement("a"); a.download = "qr-temporadas-de-nosotros.png"; a.href = c.toDataURL("image/png"); a.click();
      };
    })();
  </script>
</body>
</html>
